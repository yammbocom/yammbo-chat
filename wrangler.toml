name = "yammbo-chat"
main = "src/index.ts"
compatibility_date = "2026-01-15"
compatibility_flags = ["nodejs_compat"]

# Stream this worker's trace events to the central yammbo-tail Worker. CF
# delivers traces even when an invocation is KILLED (exceededCpu/exceededMemory)
# before the worker's own try/catch can fire — the silent-cron-failure safety net.
tail_consumers = [{ service = "yammbo-tail" }]

# Custom domain bound via API REST (see post-deploy step in README)
# Wrangler v3 with this token tries the /zones/.../workers/routes endpoint
# which the current API token doesn't have scope for. Setting up the
# custom domain via /accounts/.../workers/domains works fine.

# Re-sync Vectorize with the bundled KB when it changed (see scheduled() in src/index.ts).
[triggers]
crons = ["*/15 * * * *"]

# Fonts served at /fonts/*.woff2 and the panel PWA icons (src/panel-icons/*.png)
# are imported as ArrayBuffers.
[[rules]]
type = "Data"
globs = ["**/*.woff2", "**/*.png"]
fallthrough = false

[[kv_namespaces]]
binding = "CHAT_SESSIONS"
id = "fa47f766a3ad426a84e721ab4ae14016"

# Workers AI — multilingual embeddings (@cf/baai/bge-m3, 1024 dims) for RAG.
[ai]
binding = "AI"

# Vectorize — the embedded Help Center KB. Create once with:
#   wrangler vectorize create yammbo-kb --dimensions=1024 --metric=cosine
#   wrangler vectorize create-metadata-index yammbo-kb --property-name=lang --type=string
# then POST /admin/reindex to populate. Retrieval filters by the `lang` metadata.
[[vectorize]]
binding = "KB_INDEX"
index_name = "yammbo-kb"

# D1 — chat transcripts, leads, feedback, panel page views, push subscriptions, inbox (notes, tags, canned replies),
# live presence + proactive rules (retention handled in scheduled()).
# Schema: migrations/0001_init.sql, 0002_panel.sql, 0003_inbox.sql, 0004_live.sql
[[d1_databases]]
binding = "DB"
database_name = "yammbo-chat"
database_id = "934ca26c-f303-4628-8ce4-90d1df9d9910"

# Workers Rate Limiting (per CF-Connecting-IP). Chat + feedback share one budget;
# POST /api/visit has its own so page tracking never eats the chat's allowance;
# presence heartbeats have theirs too.
[[unsafe.bindings]]
name = "CHAT_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 12, period = 60 }

[[unsafe.bindings]]
name = "LEAD_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 3, period = 60 }

[[unsafe.bindings]]
name = "VISIT_LIMITER"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 40, period = 60 }

# Presence heartbeats (every 30 s per open tab) and leave beacons.
[[unsafe.bindings]]
name = "PRESENCE_LIMITER"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 60, period = 60 }

# Secrets (set via: wrangler secret put <NAME>)
# - GROQ_API_KEY
# - GEMINI_API_KEY   fallback provider
# - ADMIN_KEY        x-admin-key for POST /admin/reindex
# - TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID   lead alerts, new-conversation alerts and the /panel login code
# - IP_SALT          salt for the daily ip_hash and the panel's login throttling
# Local only (.dev.vars, never a production secret): PANEL_DEV_CODE=<8 characters of 23456789ABCDEFGHJKMNPQRSTUVWXYZ>
#   lets /panel login without Telegram, and only for localhost/127.0.0.1 requests.

[vars]
# Non-secret config
ALLOWED_ORIGINS = "https://chat.yammbo.com,https://yammbo.com,https://web.yammbo.com,https://pos.yammbo.com,https://music.yammbo.com,https://store.yammbo.com,https://tv.yammbo.com,https://blog.yammbo.com,https://help.yammbo.com,https://frank.yammbo.com,https://app.yammbo.com,https://link.yammbo.com"
GROQ_MODEL = "openai/gpt-oss-120b"
MAX_HISTORY_MESSAGES = "12"
SESSION_TTL_SECONDS = "3600"
WHATSAPP_ALERT_TEMPLATE_NAME = "yammbo_agent_alert"
WHATSAPP_ALERT_TEMPLATE_LANG = "es"
ZEPTOMAIL_FROM_EMAIL = "support@yammbo.com"
ZEPTOMAIL_FROM_NAME = "Yammbo"
AGENT_ALERT_EMAIL = "support@yammbo.com"

[observability]
enabled = true
