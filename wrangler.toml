name = "yammbo-chat"
main = "src/index.ts"
compatibility_date = "2026-01-15"
compatibility_flags = ["nodejs_compat"]

# Stream this worker's trace events to the central yammbo-tail Worker. CF
# delivers traces even when an invocation is KILLED (exceededCpu/exceededMemory)
# before the worker's own try/catch can fire — the silent-cron-failure safety net.
tail_consumers = [{ service = "yammbo-tail" }]

# Custom domain bound via API REST (see post-deploy step in README)
# Wrangler v3 with this token tries the /zones/.../workers/routes endpoint
# which the current API token doesn't have scope for. Setting up the
# custom domain via /accounts/.../workers/domains works fine.

[[kv_namespaces]]
binding = "CHAT_SESSIONS"
id = "fa47f766a3ad426a84e721ab4ae14016"

# Workers AI — multilingual embeddings (@cf/baai/bge-m3, 1024 dims) for RAG.
[ai]
binding = "AI"

# Vectorize — the embedded Help Center KB. Create once with:
#   wrangler vectorize create yammbo-kb --dimensions=1024 --metric=cosine
#   wrangler vectorize create-metadata-index yammbo-kb --property-name=lang --type=string
# then POST /admin/reindex to populate. Retrieval filters by the `lang` metadata.
[[vectorize]]
binding = "KB_INDEX"
index_name = "yammbo-kb"

# Secrets (set via: wrangler secret put <NAME>)
# - GROQ_API_KEY
# - GEMINI_API_KEY   fallback provider
# - ADMIN_KEY        x-admin-key for POST /admin/reindex

[vars]
# Non-secret config
ALLOWED_ORIGINS = "https://chat.yammbo.com,https://yammbo.com,https://web.yammbo.com,https://pos.yammbo.com,https://music.yammbo.com,https://store.yammbo.com,https://flow.yammbo.com,https://tv.yammbo.com,https://blog.yammbo.com,https://help.yammbo.com,https://frank.yammbo.com,https://app.yammbo.com"
GROQ_MODEL = "llama-3.3-70b-versatile"
MAX_HISTORY_MESSAGES = "12"
SESSION_TTL_SECONDS = "3600"
WHATSAPP_ALERT_TEMPLATE_NAME = "yammbo_agent_alert"
WHATSAPP_ALERT_TEMPLATE_LANG = "es"
ZEPTOMAIL_FROM_EMAIL = "noreply@yammbo.com"
ZEPTOMAIL_FROM_NAME = "Yammbo"
AGENT_ALERT_EMAIL = "frank@yammbo.com"

[observability]
enabled = true
